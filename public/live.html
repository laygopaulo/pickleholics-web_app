<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickleholics — Live</title>
<style>
:root{--bg:#0d1409;--card:#18221200;--c:#1a2613;--ink:#eef6e2;--mut:#93a583;--acc:#a3d94f;--bd:#2c3b20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:clamp(14px,1.5vw,22px) system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:#1f3310}header h1{margin:0;font-size:1.8em}header small{color:var(--acc)}
#clock{margin-left:auto;font-size:1.5em;font-variant-numeric:tabular-nums}header button{background:none;color:var(--ink);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
.wrap{display:grid;grid-template-columns:2fr 1fr;gap:20px;padding:20px 24px}@media(max-width:900px){.wrap{grid-template-columns:1fr}}
h2{margin:0 0 10px;color:var(--acc);font-size:1.1em;text-transform:uppercase;letter-spacing:.08em}
.courts{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-bottom:20px;
}

.courts .card{
    min-height:220px;
    padding:24px;
}

@media(max-width:1200px){
    .courts{
        grid-template-columns:1fr;
    }
}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:10px}.courts .card{margin:0;border-left:6px solid var(--acc)}.courts .free{border-left-color:var(--bd);opacity:.6}
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--mut);
    font-size:1.4em;
}.top b{
    color:var(--ink);
    font-size:1.8em;
}

.tm{
    font-weight:700;
    font-size:2em;
    margin:10px 0;
}

.vs{
    color:var(--mut);
    font-size:1.2em;
}.vs{color:var(--mut);font-size:.8em}
.tag{background:var(--bd);border-radius:99px;padding:2px 10px;font-size:.7em}table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--bd)}th:last-child,
td:last-child{
    text-align:right;
}

th{
    text-align:left;
}

th:nth-child(4){
    text-align:right;
}
.wait{color:var(--mut);margin-top:6px}
</style></head><body>
<header><h1><img src="/images/pickleholics.jpg"  width="50" height="50" 
         alt="Pickleholics Logo"> Pickleholics <small>LIVE</small></h1><span id="clock"></span><button onclick="document.documentElement.requestFullscreen()">⛶ Fullscreen</button></header>
<div class="wrap"><section><h2>Now playing</h2><div id="courts" class="courts"></div></section>
<aside><h2>Next in line</h2><div id="next"></div><h2 style="margin-top:20px">Leaderboard</h2><div class="card">
<table style="width:100%">
<thead>
<tr>
<th>#</th>
<th>Player</th>
<th>W-L</th>
<th>Point Diff</th>
</tr>
</thead>
<tbody id="lb"></tbody>
</table>
</div></div></aside></div>
<script>
let S=null,off=0;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=id=>esc(S.players.find(p=>p.id===id)?.name||'?'),team=a=>a.map(nm).join(' &amp; ');
async function load(){S=await(await fetch('/api/state')).json();off=S.now-Date.now();draw()}
function draw(){if(!S)return;const now=Date.now()+off;$('#clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 let h='';for(let c=1;c<=S.courts;c++){const m=S.matches.find(x=>x.court===c);
  h+=m?`<div class="card"><div class="top"><b>Court ${c}</b><span>${Math.floor((now-m.started)/60000)} min</span></div><div class="tm">${team([m.t1a,m.t1b])}</div><div class="vs">VS</div><div class="tm">${team([m.t2a,m.t2b])}</div></div>`
  :`<div class="card free"><div class="top"><b>Court ${c}</b><span>Open</span></div></div>`}
 $('#courts').innerHTML=h;
 $('#next').innerHTML=(S.suggestions
  .slice(0,2)
  .map((s,i)=>`<div class="card"><div class="top"><b>Next #${i+1}</b><span class="tag">${s.called?'📣 CALLING · ':''}${esc(s.note)}</span></div><div class="tm">${team(s.t1)}</div><div class="vs">VS</div><div class="tm">${team(s.t2)}</div></div>`).join('')||'<div class="card vs">Waiting for 4 players…</div>')
  +`<div class="wait">${S.queue.length} waiting: ${S.queue.slice(0,8).map(r=>esc(r.player.name)).join(', ')||'—'}</div>`;
 $('#lb').innerHTML=
S.players.slice(0,10).map((p,i)=>`
<tr>
<td>${['🥇','🥈','🥉'][i]||i+1}</td>
<td>${esc(p.name)}</td>
<td>${p.wins}-${p.losses}</td>
<td>
<b style="color:${(p.points_diff||0)>=0?'#4ade80':'#f87171'}">
${(p.points_diff||0)>0?'+':''}${p.points_diff||0}
</b>
</td>
</tr>
`).join('');}
const es=new EventSource('/events');es.onmessage=load;es.onopen=load;setInterval(draw,15000);load();
</script></body></html>
